name: Build static FFmpeg

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
  schedule:
    # Publish one build release on the first day of every month.
    - cron: "17 3 1 * *"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            artifact: linux-amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            artifact: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      # Exposes the cache token that buildx needs for type=gha.
      - uses: crazy-max/ghaction-github-runtime@v4
      - name: Build and export
        run: |
          make validate-lock
          build_date=$(date -u +%Y%m%d)
          scope="ffmpeg-${{ matrix.artifact }}"
          cache_args="--cache-to type=gha,mode=max,scope=$scope,ignore-error=true"
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            # Monthly release: rebuild from scratch for fresh Alpine packages, then refresh the cache.
            cache_args="--no-cache $cache_args"
          else
            cache_args="--cache-from type=gha,scope=$scope $cache_args"
          fi
          make export \
            CACHE_ARGS="$cache_args" \
            PLATFORM="${{ matrix.platform }}" \
            BUILD_ID="${GITHUB_SHA::12}" \
            BUILD_DATE="$build_date"
          sha256sum dist/ffmpeg-* dist/ffprobe-* dist/raw2bmx-* dist/bmxtranswrap-* > dist/SHA256SUMS
          cp versions.lock dist/versions.lock
          {
            printf 'FFmpeg Musl Forge build information\n'
            printf 'Platform: %s\n' '${{ matrix.platform }}'
            printf 'Artifact: %s\n' '${{ matrix.artifact }}'
            printf 'Build ID: %s\n' "${GITHUB_SHA::12}"
            printf 'Build date: %s\n\n' "$build_date"
            printf '%s\n' 'ffmpeg -version:'
            find dist -maxdepth 1 -type f -name 'ffmpeg-*' -print -quit | xargs -r -n1 sh -c '"$0" -version'
            printf '\n%s\n' 'ffprobe -version:'
            find dist -maxdepth 1 -type f -name 'ffprobe-*' -print -quit | xargs -r -n1 sh -c '"$0" -version'
            printf '\n%s\n' 'Binary files:'
            find dist -maxdepth 1 -type f \( -name 'ffmpeg-*' -o -name 'ffprobe-*' -o -name 'raw2bmx-*' -o -name 'bmxtranswrap-*' \) -printf '%f\n' | sort
          } > dist/BUILDINFO.txt
      - uses: actions/upload-artifact@v6
        with:
          name: ffmpeg-bmx-${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error

  release:
    if: github.event_name == 'schedule' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Determine release metadata
        id: metadata
        run: |
          set -eux
          ffmpeg_version=$(jq -er '.sources.ffmpeg.version' versions.lock)
          build_date=$(date -u +%d%b%y)
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            tag="v${ffmpeg_version}-${build_date}"
          elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            tag="v${ffmpeg_version}-${build_date}-${GITHUB_SHA::12}"
          else
            tag="$GITHUB_REF_NAME"
          fi
          echo "ffmpeg_version=$ffmpeg_version" >> "$GITHUB_OUTPUT"
          echo "build_date=$build_date" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if ! git ls-remote --exit-code origin "refs/tags/$tag" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$tag" "$GITHUB_SHA"
            git push origin "$tag"
          fi
      - name: Download amd64 artifacts
        uses: actions/download-artifact@v8
        with:
          name: ffmpeg-bmx-linux-amd64
          path: release/linux-amd64
      - name: Download arm64 artifacts
        uses: actions/download-artifact@v8
        with:
          name: ffmpeg-bmx-linux-arm64
          path: release/linux-arm64
      - name: Assemble release assets
        run: |
          set -eux
          cp release/linux-amd64/versions.lock release/versions.lock
          cp release/linux-amd64/SHA256SUMS release/SHA256SUMS-linux-amd64
          cp release/linux-arm64/SHA256SUMS release/SHA256SUMS-linux-arm64
          cp release/linux-amd64/BUILDINFO.txt release/BUILDINFO-linux-amd64.txt
          cp release/linux-arm64/BUILDINFO.txt release/BUILDINFO-linux-arm64.txt
          find release/linux-amd64 release/linux-arm64 -maxdepth 1 -type f \
            ! -name 'SHA256SUMS' ! -name 'versions.lock' ! -name 'BUILDINFO.txt' -exec cp {} release/ \;
          (
            cd release
            sha256sum ffmpeg-* ffprobe-* raw2bmx-* bmxtranswrap-* > SHA256SUMS
          )
          {
            printf '%s\n\n' '# FFmpeg Musl Forge ${{ steps.metadata.outputs.tag }}'
            printf '%s\n\n' 'Static, CPU-only musl binaries for Linux amd64 and arm64, built from the pinned sources in this repository.'
            printf '%s\n' '## Build summary'
            printf '%s\n' ''
            printf '| Field | Value |\n| --- | --- |\n'
            printf '| FFmpeg version | `%s` |\n' '${{ steps.metadata.outputs.ffmpeg_version }}'
            printf '| Build date (UTC) | `%s` |\n' '${{ steps.metadata.outputs.build_date }}'
            printf '| Git commit | `%s` |\n' "${GITHUB_SHA}"
            printf '| Architectures | `linux/amd64`, `linux/arm64` |\n\n'

            printf '%s\n\n' '## Included binaries'
            printf '%s\n' '- `ffmpeg` — FFmpeg command-line encoder, decoder, and media processor'
            printf '%s\n' '- `ffprobe` — media stream and container inspection tool'
            printf '%s\n' '- `raw2bmx` — MXF essence and metadata utility'
            printf '%s\n\n' '- `bmxtranswrap` — MXF rewrapping utility'
            printf '%s\n\n' 'The filenames include the upstream component version, UTC build date, and target architecture. The exact `ffmpeg -version` and `ffprobe -version` output for each architecture is included in the `BUILDINFO-*.txt` assets.'

            printf '%s\n\n' '## Dependency versions'
            printf '%s\n\n' 'The attached `versions.lock` is the authoritative bill of materials: it records the exact version, revision, source URL, and SHA-256 for the Alpine base, toolchain, FFmpeg, BMX, and every statically linked dependency.'
            printf '| Component | Version | Revision |\n| --- | --- | --- |\n'
            jq -r '.sources | to_entries | sort_by(.key)[] | "| \(.key) | \(.value.version) | \(.value.revision // "—") |"' release/versions.lock
            printf '\n%s\n\n' '## Integrity and provenance'
            printf '%s\n' '- `SHA256SUMS` contains checksums for all release binaries.'
            printf '%s\n' '- `SHA256SUMS-linux-amd64` and `SHA256SUMS-linux-arm64` contain the checksums produced independently on each build runner.'
            printf '%s\n' '- `BUILDINFO-linux-amd64.txt` and `BUILDINFO-linux-arm64.txt` contain the complete FFmpeg/FFprobe version output and the binary filenames for each target.'
            printf '%s\n' '- The tagged repository source and attached `versions.lock` identify the build inputs.'
          } > release/RELEASE_NOTES.md
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.metadata.outputs.tag }}
          body_path: release/RELEASE_NOTES.md
          generate_release_notes: true
          files: |
            release/ffmpeg-*
            release/ffprobe-*
            release/raw2bmx-*
            release/bmxtranswrap-*
            release/SHA256SUMS
            release/SHA256SUMS-linux-amd64
            release/SHA256SUMS-linux-arm64
            release/versions.lock
            release/BUILDINFO-linux-amd64.txt
            release/BUILDINFO-linux-arm64.txt
            release/RELEASE_NOTES.md
