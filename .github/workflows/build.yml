name: Build static FFmpeg

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 1 * *"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            artifact: linux-amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            artifact: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build and export
        run: |
          make validate-lock
          build_date=$(date -u +%Y%m%d)
          make export \
            PLATFORM="${{ matrix.platform }}" \
            BUILD_ID="${GITHUB_SHA::12}" \
            BUILD_DATE="$build_date"
          sha256sum dist/ffmpeg-* dist/ffprobe-* dist/raw2bmx-* dist/bmxtranswrap-* > dist/SHA256SUMS
          cp versions.lock dist/versions.lock
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-bmx-${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download amd64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-bmx-linux-amd64
          path: release/linux-amd64
      - name: Download arm64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-bmx-linux-arm64
          path: release/linux-arm64
      - name: Assemble release assets
        run: |
          set -eux
          cp release/linux-amd64/versions.lock release/versions.lock
          cp release/linux-amd64/SHA256SUMS release/SHA256SUMS-linux-amd64
          cp release/linux-arm64/SHA256SUMS release/SHA256SUMS-linux-arm64
          find release/linux-amd64 release/linux-arm64 -maxdepth 1 -type f \
            ! -name 'SHA256SUMS' ! -name 'versions.lock' -exec cp {} release/ \;
          (
            cd release
            sha256sum ffmpeg-* ffprobe-* raw2bmx-* bmxtranswrap-* > SHA256SUMS
          )
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/ffmpeg-*
            release/ffprobe-*
            release/raw2bmx-*
            release/bmxtranswrap-*
            release/SHA256SUMS
            release/SHA256SUMS-linux-amd64
            release/SHA256SUMS-linux-arm64
            release/versions.lock
